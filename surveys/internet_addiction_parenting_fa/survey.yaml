# -----------------------------------------------------------------------------
# 3. STATIC ANSWERS — answered from the persona record, never by the LLM
# -----------------------------------------------------------------------------
# Each value must render to EXACTLY one of that question's option strings. Every
# one of these is a RADIO, so all five are sampled as categoricals over the
# literal strings above rather than as numbers to be formatted here.
static_answers:
  - name: grade
    match: {question_id_in: ["50270726"]}   # پایه تحصیلی شماچیست؟
    value: "{{ persona.demographics.grade }}"
  - name: age
    match: {question_id_in: ["50270688"]}   # سن شماچقدر است؟
    value: "{{ persona.demographics.age_option }}"
  - name: gender
    match: {question_id_in: ["50270618"]}   # جنسیت شماچیست؟
    value: "{{ persona.demographics.gender }}"
  - name: city
    match: {question_id_in: ["50270785"]}   # شهر محل سکونت خود را انتخاب کنید:
    value: "{{ persona.demographics.city }}"
  - name: daily_internet_hours
    match: {question_id_in: ["50270936"]}   # به طور روزانه چند ساعت از اینترنت استفاده می کنید؟
    value: "{{ persona.demographics.daily_internet_hours }}"

# The only free-text question on the form, and explicitly «(اختیاری)». Skipping
# it drops it from generation AND from the completeness denominator, so the
# min_ratio: 1.0 gate below is measured over the 114 required questions.
# Do NOT bind a fabricated e-mail address here.
skip:
  - question_id_in: ["50293066"]   # در صورتی که تمایل دارید از نتایج این پژوهش مطلع شوید، می‌توانید آدرس ایمیل خود ر

# -----------------------------------------------------------------------------
# 4. ANSWERING POLICY
# -----------------------------------------------------------------------------
answering:
  chunk_by: construct
  shuffle_within_chunk: true
  temperature: {min: 0.55, max: 0.85}

  normalization:
    unicode: NFKC
    fold_arabic_to_persian: true      # ي→ی ، ك→ک — the PAQ items use Arabic yeh
    zwnj: strip
    strip_trailing: ".,؛،۔"

  fuzzy: {algorithm: ratio, min_score: 86}

  completeness:
    # 1.0, not the 0.95 default: every remaining question is required, and a set
    # accepted with blanks here stalls in phase 4 on an empty radio group.
    min_ratio: 1.0
    denominator: answerable
    max_retries: 2
    retry_scope: failed_constructs_only

  careless:
    enabled: true
    anchor_stickiness: 0.70
    drift: [-1, 1]
    apply_static_answers: true

  reverse_tags: {direct: "[مستقیم]", reverse: "[معکوس]"}

response_style_nudges:
  rules:
    - {when: "acquiescence > 0.30",      text: "در گویه‌های مرزی که مطمئن نیستی، گرایش خفیفی به سمت گزینه‌های موافق/بالاتر داری."}
    - {when: "acquiescence < -0.30",     text: "در گویه‌های مرزی که مطمئن نیستی، گرایش خفیفی به سمت گزینه‌های مخالف/پایین‌تر داری."}
    - {when: "extreme_response > 0.30",  text: "وقتی گزینه‌ای واقعاً با حال‌وروزت می‌خواند، راحت از گزینه‌ی انتهای طیف (مثل «همیشه» یا «خیلی موافقم») استفاده می‌کنی."}
    - {when: "extreme_response < -0.30", text: "معمولاً گزینه‌های ملایم و میانی را به گزینه‌های انتهای طیف ترجیح می‌دهی."}
  default: "سبک پاسخ‌دهی‌ات معمولی و متعادل است."

# -----------------------------------------------------------------------------
# 5. ANALYSIS
# -----------------------------------------------------------------------------
analysis:
  reverse_keys_from: config           # never auto-flip on observed sign
  warn_on_sign_disagreement: true
  # Every psychometric scale here is 4- or 5-point, so nothing is excluded; the
  # two 2-option questions on the form are demographics and are static-bound.
  response_style_min_scale_points: 3
  straightlining: {scope: within_construct, sd_threshold: 0.5}
  sanity: {alpha_max: 0.95, mean_inter_item_r_max: 0.6}
  min_items_for_alpha: 3
