# =============================================================================
# PersonaBot survey spec — «اعتیاد به اینترنت و شیوه‌های فرزندپروری در نوجوانان»
# Live Porsline form, Persian, 115 questions.
#
# Instrument, as read off the extracted schema:
#   • Q1–Q5    demographics (grade, age, gender, city, daily internet hours)
#   • 20 items Young's Internet Addiction Test (IAT), 5-point frequency
#   • 76 items Schaefer-style parenting questionnaire (شیوه‌های فرزندپروری),
#              5-point agreement — the warmth/hostility and control/autonomy axes
#   • 13 items Buri-style Parental Authority Questionnaire (PAQ), 4-point
#   • 1 item   optional e-mail address (free text) — skipped, see `skip:`
#
# STATUS: construct membership is a PROPOSAL derived by reading all 109
# psychometric item texts. Judgement calls are marked `# REVIEW:`. The validator
# can prove this file is COMPLETE; only you can decide whether it is CORRECT.
#
# Generated ids and option strings are copied verbatim from form_schema.json.
# =============================================================================
version: 2
id: internet_addiction_parenting_fa
locale: fa

# Migrated from the 2.x fork `PersonaBot-new-yasamin` (its .env and Makefile).
form:
  provider: porsline
  url: https://survey.porsline.ir/s/K4zJVAOV
  max_pages: 400
# -----------------------------------------------------------------------------
# 1. POPULATION — adolescent boys, grades 7–12, Tehran and Shahrekord
# -----------------------------------------------------------------------------
population:
  seed: null

  # Three latent dimensions, one per research construct.
  #
  # Two common factors carry the hypotheses:
  #   P = positive parenting climate (warmth AND structure load positively)
  #   A = addiction proneness        (parenting dimensions load negatively)
  #
  # Implied correlations — `make validate` prints this matrix, read it:
  #   H1  r(parental_affection,   internet_addiction) = -0.50   NEGATIVE ✓
  #   H2  r(parental_supervision, internet_addiction) = -0.47   NEGATIVE ✓
  #       r(parental_affection,   parental_supervision) = +0.54
  #
  # Magnitudes are deliberately moderate. Published adolescent samples put the
  # parenting↔internet-addiction association in the -0.20…-0.45 band; -0.50 sits
  # at the strong end of plausible, which is what you want from a simulation
  # built to exercise the hypotheses rather than to reproduce one field study.
  latent_model:
    common_factors: [P, A]
    dimensions:
      parental_affection:
        loadings: {P: 0.78, A: -0.18}      # ΣL² = 0.641
        label: "محبت و پذیرش والدینی (گرمی، حمایت عاطفی، تأیید و پذیرفته‌شدن از سوی پدر و مادر)"
      parental_supervision:
        loadings: {P: 0.64, A: -0.24}      # ΣL² = 0.467
        label: "نظارت و نظم‌دهی والدینی (قاعده‌گذاری، پیگیری رفتار، ثبات در تربیت)"
      internet_addiction:
        loadings: {P: -0.48, A: 0.68}      # ΣL² = 0.693
        label: "اعتیاد به اینترنت (اشتغال ذهنی، ناتوانی در کنترل زمان، اختلال در تحصیل و خواب)"

  bands:
    cuts:   [-1.5, -0.9, -0.35, 0.35, 0.9, 1.5]
    labels: ["خیلی پایین", "پایین", "کمی پایین", "متوسط", "کمی بالا", "بالا", "خیلی بالا"]

  response_style:
    acquiescence:     {dist: normal, mu: 0.0, sigma: 0.40}
    extreme_response: {dist: normal, mu: 0.0, sigma: 0.40}
    careless:         {dist: bernoulli, p: 0.04}

  # --- demographics, in dependency order --------------------------------------
  # Every value below that is bound to a RADIO in `static_answers` is sampled as
  # a categorical over the form's LITERAL option strings. Static answers are not
  # fuzzy-matched — they are written into the answer file and then clicked on a
  # live radio group, so anything but a character-for-character match fails in
  # phase 4.
  demographics:
    # Target audience is پسران نوجوان — 100% male, so this is a constant, not a
    # 50/50 draw that would occasionally emit «دختر».
    - name: gender
      dist: constant
      value: "پسر"

    # 50% Tehran / 50% Shahrekord. NOTE: this is 50/50 in EXPECTATION — each
    # respondent is an independent draw, so a run of 40 personas will land near
    # 20/20, not exactly on it. There is no quota mechanism in the sampler. If
    # you need an exact split, generate the two halves as two runs with this
    # weight set to [1, 0] and then [0, 1].
    - name: city
      dist: categorical
      choices: [["تهران", 0.5], ["شهرکرد", 0.5]]

    # Grades 7–12. Not equal: the mild decline across the upper grades reflects
    # attrition and the smaller senior cohorts typical of Iranian schools.
    - name: grade
      dist: categorical
      choices:
        - ["هفتم", 0.18]
        - ["هشتم", 0.18]
        - ["نهم", 0.17]
        - ["دهم", 0.16]
        - ["یازدهم", 0.16]
        - ["دوازدهم", 0.15]

    # Numeric grade, so age can be drawn conditionally on it. Not persisted —
    # it is scaffolding, and `grade` already carries the same fact in Persian.
    - name: grade_level
      persist: false
      dist: conditional
      cases:
        - {when: "grade == 'هفتم'",  dist: constant, value: 7}
        - {when: "grade == 'هشتم'",  dist: constant, value: 8}
        - {when: "grade == 'نهم'",  dist: constant, value: 9}
        - {when: "grade == 'دهم'",  dist: constant, value: 10}
        - {when: "grade == 'یازدهم'",  dist: constant, value: 11}
        - {default: true, dist: constant, value: 12}

    # Age follows grade (modal age = grade + 6) with realistic off-by-one for
    # late starters and repeaters. Every branch stays inside 13–18, which is both
    # the requested frame and the only range the form's own age question offers.
    - name: age
      dist: conditional
      cases:
        - {when: "grade_level == 7",  dist: categorical, choices: [[13, 0.85], [14, 0.15]]}
        - {when: "grade_level == 8",  dist: categorical, choices: [[13, 0.05], [14, 0.85], [15, 0.10]]}
        - {when: "grade_level == 9",  dist: categorical, choices: [[14, 0.07], [15, 0.85], [16, 0.08]]}
        - {when: "grade_level == 10", dist: categorical, choices: [[15, 0.07], [16, 0.85], [17, 0.08]]}
        - {when: "grade_level == 11", dist: categorical, choices: [[16, 0.08], [17, 0.85], [18, 0.07]]}
        - {default: true,             dist: categorical, choices: [[17, 0.12], [18, 0.88]]}

    # The form's age options are written without a space («13سال»), so the
    # numeric age above cannot be bound to the radio directly.
    - name: age_option
      dist: conditional
      cases:
        - {when: "age == 13", dist: constant, value: "13سال"}
        - {when: "age == 14", dist: constant, value: "14سال"}
        - {when: "age == 15", dist: constant, value: "15سال"}
        - {when: "age == 16", dist: constant, value: "16سال"}
        - {when: "age == 17", dist: constant, value: "17سال"}
        - {default: true,     dist: constant, value: "18سال"}

    # Daily hours online is a FACT about the respondent, not an opinion, so it is
    # sampled from the addiction trait rather than left to the model — that keeps
    # it coherent with the 20 IAT answers instead of contradicting them.
    #
    # REVIEW: the form's own bands are malformed — «3تا5ساعت» is followed by
    # «بیش از7ساعت», so 5–7 hours has no bucket. Left exactly as extracted; an
    # option string the browser cannot find is an unclickable radio.
    - name: daily_internet_hours
      dist: conditional
      cases:
        - when: "z.internet_addiction > 1.0"
          dist: categorical
          choices: [["بیش از7ساعت", 0.55], ["3تا5ساعت", 0.30], ["1تا3ساعت", 0.13], ["کمتراز1ساعت", 0.02]]
        - when: "z.internet_addiction > 0.0"
          dist: categorical
          choices: [["بیش از7ساعت", 0.22], ["3تا5ساعت", 0.38], ["1تا3ساعت", 0.33], ["کمتراز1ساعت", 0.07]]
        - when: "z.internet_addiction > -1.0"
          dist: categorical
          choices: [["بیش از7ساعت", 0.08], ["3تا5ساعت", 0.22], ["1تا3ساعت", 0.48], ["کمتراز1ساعت", 0.22]]
        - default: true
          dist: categorical
          choices: [["بیش از7ساعت", 0.02], ["3تا5ساعت", 0.08], ["1تا3ساعت", 0.40], ["کمتراز1ساعت", 0.50]]

  # No factual value on this form needs computing outside the frame above.
  derived_fields: []

# -----------------------------------------------------------------------------
# 2. SCHEMA INTERPRETATION
# -----------------------------------------------------------------------------
# CODING DIRECTION — the one thing here that is silently wrong if you get it
# wrong. `low_first` = option[0] is the LOW end (score = index + 1);
# `high_first` = option[0] is the HIGH end (score = K - index).
scales:
  # 76 parenting items. option[0] is «خیلی موافقم» — the HIGH end of agreement —
  # so this is high_first. Getting this backwards would invert every parenting
  # score and quietly flip both hypotheses.
  - name: agreement5_parenting
    match: {options_equal: ["خیلی موافقم", "موافقم", "تا حدودی", "مخالفم", "خیلی مخالفم"]}
    coding: high_first

  # IAT frequency, option[0] «به ندرت» is the LOW end → low_first.
  - name: iat_frequency5
    match: {options_equal: ["به ندرت", "گاهی اوقات", "اغلب", "بیشتر اوقات", "همیشه"]}
    coding: low_first

  # REVIEW: 4 IAT items carry «بیشتراوقات» (no space) where the other 16 have
  # «بیشتر اوقات». `options_equal` is an exact set comparison and normalization
  # collapses runs of whitespace but never deletes it, so these do NOT share a
  # signature. Declared separately rather than "fixed" — the schema records what
  # is really on the page.
  - name: iat_frequency5_variant
    match: {options_equal: ["به ندرت", "گاهی اوقات", "اغلب", "بیشتراوقات", "همیشه"]}
    coding: low_first

  # The 13 PAQ items arrive in four near-identical 4-point variants
  # («برخی اوقات»/«گاهی اوقات» and «تاحدودی»/«حدودا»).
  # All four run «همیشه» → «هرگز», i.e. high end first.
  - name: paq_frequency4_a
    match: {options_equal: ["همیشه", "برخی اوقات", "تاحدودی", "هرگز"]}
    coding: high_first
  - name: paq_frequency4_b
    match: {options_equal: ["همیشه", "گاهی اوقات", "تاحدودی", "هرگز"]}
    coding: high_first
  - name: paq_frequency4_c
    match: {options_equal: ["همیشه", "برخی اوقات", "حدودا", "هرگز"]}
    coding: high_first
  - name: paq_frequency4_d
    match: {options_equal: ["همیشه", "گاهی اوقات", "حدودا", "هرگز"]}
    coding: high_first

  # Demographic response formats. Declared so the coverage report accounts for
  # them explicitly; all five are bound in `static_answers` and therefore never
  # reach a construct or the reliability statistics.
  - name: demo_grade6
    match: {options_equal: ["هفتم", "هشتم", "نهم", "دهم", "یازدهم", "دوازدهم"]}
    coding: low_first
  - name: demo_age6
    match: {options_equal: ["13سال", "14سال", "15سال", "16سال", "17سال", "18سال"]}
    coding: low_first
  - name: demo_gender2
    match: {options_equal: ["دختر", "پسر"]}
    coding: low_first
  - name: demo_city2
    match: {options_equal: ["تهران", "شهرکرد"]}
    coding: low_first
  - name: demo_hours4
    match: {options_equal: ["کمتراز1ساعت", "1تا3ساعت", "3تا5ساعت", "بیش از7ساعت"]}
    coding: low_first

# -----------------------------------------------------------------------------
# CONSTRUCTS
# -----------------------------------------------------------------------------
# Seven constructs over three latent traits. The split is driven by two forces:
#
#   1. A construct is the LLM REQUEST UNIT — one call per construct per
#      respondent. 76 parenting items in one JSON object invites truncation and
#      drives Cronbach's alpha to implausible highs. Chunks here are 8–20 items.
#   2. Reverse-keyed items are grouped with their own pole, so the model is not
#      asked to hold "high = more" and "high = less" in mind within one chunk.
#
# All rules are explicit `question_id_in` lists and are mutually disjoint, so
# evaluation order does not matter here.
constructs:
  # === اعتیاد به اینترنت =======================================================
  # Young's IAT, all 20 items, all direct: a higher frequency always means more
  # addiction. Kept as ONE construct — splitting a unidimensional published scale
  # would report two meaningless alphas instead of the one that matters.
  - key: internet_addiction
    label: "اعتیاد به اینترنت و الگوی استفاده از فضای مجازی"
    traits: [internet_addiction]
    match:
      question_id_in:
        - "50271689"   # چند وقت یکبار برای زمانی طولانی تر از آنچه که دوست داشتی، در اینترنت می مانی؟
        - "50271799"   # چند وقت یکبار از انجام کارهای خانه صرف نظر می کنی تا زمان بیشتری را در اینترنت بمانی؟
        - "50271891"   # چند وقت یکبار هیجانِ بودن در اینترنت را به گذراندن وقت خود با خانواده (یا هر دوست نزدیک…
        - "50272627"   # چند وقت یکبار به دنبال ایجاد ارتباط جدیدی با کاربران اینترنتی هستی؟
        - "50272718"   # چند وقت یکبار افراد خانواده ات از مدت زمانی که در اینترنت صرف می کنی،ابراز ناراحتی می ک…
        - "50272862"   # چند وقت یکبار مقدار زمانی که در اینترنت صرف می کنی،موجب انجام ندادن وظایف یا انجام تکال…
        - "50273118"   # چند وقت یکبار قبل از انجام هر کار ضروری فضای مجازی خود را چک می کنی؟
        - "50273196"   # چند وقت یکبار پرداختن به اینترنت، موجب ایجاد مشکل در کارت می شود؟
        - "50273441"   # چند وقت یکبار، وقتی اطرافیان از شما می پرسند در اینترنت چکار می کنی،حالت دفاعی یا پنهان…
        - "50273494"   # چند وقت یکبار سعی می کنی خودت را از دست افکار آزارنده در زندگی، با مشغول کردن خود در ای…
        - "50273532"   # چند وقت یکبار،دوباره وارد اینترنت شدن را زود تر از زمانی که قصد داشتی،شروع می کنی؟
        - "50273557"   # چند وقت یکبار می ترسی که زندگیت بدون اینترنت ملال آور،پوچ و بدون شادی خواهد بود؟
        - "50273635"   # هر چند وقت یکبار زمانی که در اینترنت هستی و کسی مزاحمت شود،ناراحت می شوی و به طور ناگها…
        - "50273708"   # چند وقت یکبار خوابت را به خاطر اینکه شب تا دیر وقت در اینترنت هستی از دست می دهی؟
        - "50273836"   # چند وقت یکبار وقتی که در اینترنت نیستی احساس می کنی که بد جوری فکرت در پی آن است و هوس …
        - "50274059"   # هر چندوقت یک بار به خودت می گویی فقط^ چند دقیقه دیگر ^وقتی در حال رفتن به اینترنت هستی؟
        - "50274085"   # هر چند وقت یکبار سعی می کنی مدت زمانی را که در اینترنت هستی را کوتاه کنی، اما نتوانستی؟
        - "50274141"   # هر چند وقت یکبار سعی می کنی مدت زمان در اینترنت بودنت را از دیگران پنهان کنی؟
        - "50274190"   # هر چند وقت یکبار صرف کردن وقت بیشتر در اینترنت را بر بیرون رفتن با دیگران ترجیح می دهی؟
        - "50274220"   # هر چند وقت یکبار احساس می کنی که وقتی در اینترنت نیستی افسرده یا عصبی هستی، در حالی که …
    reverse_when: {never: true}

  # === محبت و پذیرش والدینی — قطب مثبت =========================================
  # Warmth, praise, emotional availability, shared activity, being consulted.
  - key: parental_affection_warmth
    label: "محبت، پذیرش و حمایت عاطفی والدین"
    traits: [parental_affection]
    match:
      question_id_in:
        - "50277086"   # وقتی درسها و کارهای دیگرم را به اتمام میرسانم والدینم رضایت خاطر نشان میدهند
        - "50277174"   # پدرومادرم برای من امکانات فراهم میکنند تا بتوانم به کارهای ذوقی و مورد علاقه ام بپردازم
        - "50277385"   # وقتی ناراحتی خود را با پدرومادر در میان میگذارم آنها کاری میکنند که احساس آرامش کنم
        - "50277407"   # وقتی غمگینم والدینم با من همدردی می کنند
        - "50277428"   # گاهی فکر میکنم آنها که پدر و مادر ندارند چقدر تنها و بی پناه اند.
        - "50277450"   # والدینم اغلب در هرموردی مرا تشویق میکنند
        - "50277569"   # در گفتگوی خانوادگی اغلب از کارهای من به عنوان شیرین کاری و خاطره خوش تعریف میکنند
        - "50277480"   # والدینم اغلب از کارهای خوب من حرف میزنند.
        - "50277605"   # والدینم از حرف زدن با من راجع به چیزهای مختلف لذت میبرند
        - "50277638"   # ازاینکه باهم بعضی از کارهای منزل را انجام دهیم خوششان می آید.
        - "50278007"   # وقتی قرار باشد کاری بکنیم یا جایی برویم نظرمرا میپرسند.
        - "50278104"   # همیشه بامن با یک لحن محبت آمیز و گرم حرف می زنند
        - "50278211"   # اغلب با قیافه بشاش بامن برخورد میکنند.
        - "50278232"   # اغلب چیزهایی که مرا خوشحال می کند برایم میخرند
        - "50278276"   # والدینم مرا خیلی دوست دارند
        - "50278297"   # با دوستان من خیلی بامحبت رفتار می کنند
        - "50278376"   # اغلب سعی میکنند نظرات و عقاید مرا بشناسند
        - "50278399"   # من با آنها راجع به مسائل مختلف بحث میکنیم
        - "50278601"   # من و والدینم حدود انتظارات یکدیگر را دقیقا می دانیم
    reverse_when: {never: true}

  # === محبت و پذیرش والدینی — قطب منفی =========================================
  # Rejection, hostility, ridicule, neglect and love-withdrawal. EVERY item here
  # is reverse-keyed: endorsing it means LESS parental affection. That is why
  # they sit in their own chunk rather than mixed in above.
  #
  # REVIEW: 50277224 (physical punishment) and 50277259 (withdrawal of affection)
  # are punishment techniques and could equally be read as harsh discipline. They
  # are scored here as hostility/rejection, following Schaefer's warmth axis.
  - key: parental_affection_rejection
    label: "طرد، سرزنش و بی‌اعتنایی والدین"
    traits: [parental_affection]
    match:
      question_id_in:
        - "50277224"   # وقتی از دستم ناراحت میشوند مرا کتک میزنند
        - "50277259"   # اگر حرفشان را گوش نکنم محبت خود را ازمن دریغ می کنند
        - "50278647"   # آنها بعضی اوقات میگویند که احمق و نفهم هستم
        - "50278661"   # اگرباکسی اختلاف پیداکنم حتما فکر میکنند که من مقصرهستم
        - "50278744"   # تابه حال یکبار هم نشده که ازمن تعریف کنند
        - "50278818"   # اغلب به من سرکوفت دیگران را میزنند
        - "50278854"   # وقتی دردسترس نباشم که کمکشان کنم خیلی زود عصبانی میشوند
        - "50278871"   # وقتی در منزل یا اطراف آنها سروصدا ایجاد کنم عصبانی می شوند .
        - "50278894"   # پدر ومادرم منتظرند یک اشتباه بکنم تا سرم داد بزنند
        - "50279029"   # طوری با من رفتار می کنند که انگار مزاحم آنها هستم
        - "50279043"   # اغلب خوشحال میشوند که دقایقی هم که شده از شر من راحت شوند
        - "50279055"   # همیشه از زندگی شکایات میکنند که چرا من نصیب انها شده ام
        - "50279067"   # آنها حتی از دوستان من خوششان نمی آید
        - "50279082"   # چیزهایی که لازم دارم اغلب یادشان میرود بخرند
        - "50279149"   # اهمیتی به وضع لباس من نمیدهند و علاقه ای ندارند لباس خوبی بپوشم
        - "50279160"   # بامن زیاد حرف نمیزنند
