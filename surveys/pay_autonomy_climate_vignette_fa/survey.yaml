  - key: "5"
    factors: {pay: plain, autonomy: high, climate: controlling}
    text: "در سازمان شما ساختار پرداخت به‌گونه‌ای است که نیمی از دریافتی شما ثابت است و نیمی دیگر مستقیماً به عملکردتان در همین پروژه وابسته است. شما استقلال کاری بالایی در نحوه انجام کار دارید. می‌توانید درباره روش اجرای پروژه، ترتیب مراحل و زمان‌بندی فعالیت‌ها خودتان تصمیم بگیرید و برای هر مرحله نیاز به هماهنگی مستمر با سرپرست ندارید.محیط سازمان مبتنی بر کنترل و نظارت جدی است. تصمیم‌ها معمولاً به‌صورت یک‌طرفه اتخاذ می‌شوند، انتظار می‌رود دستورالعمل‌ها بدون بحث و گفتگو اجرا شوند و توضیح چندانی درباره دلایل تصمیم‌ها ارائه نمی‌شود. در صورت بروز مشکل، تمرکز مدیران بیشتر بر اصلاح سریع رفتار و تبعیت از دستورات است تا اینکه با تبادل نظر با کارکنان مشکل برطرف شود."

