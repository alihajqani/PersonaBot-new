# =============================================================================
# PersonaBot survey spec —
#   Vignette experiment: performance-contingent pay × job autonomy ×
#   organisational climate → work motivation, effort and expected performance.
#
# Live Porsline form: https://survey.porsline.ir/s/Yiz8N63e
# Persian. A master's thesis questionnaire.
#
# DESIGN (read off the scenarios document, «سناریوها.docx»):
#   The form opens on a framing statement («فرض کنید در یک سازمان مشغول به کار
#   هستید…»), then shows ONE of 12 scenario statements, drawn at random by the
#   form per session. Every respondent then answers the same items.
#
#     pay       emphasized  1–4   half the pay is contingent AND the manager keeps
#                                 stressing the bonus
#               plain       5–8   half the pay is contingent, never stressed
#               none        9–12  pay is not mentioned at all
#     autonomy  high / low        alternating in pairs
#     climate   controlling / supportive
#
#   A 3 × 2 × 2 between-subjects design. `scenarios:` below holds the texts
#   verbatim. Phase 2 spreads personas evenly over the 12 cells, phase 3 hands
#   each persona its scenario text, and phase 4 only spends an answer set on a
#   browser session whose form drew the same scenario.
#
# Instrument, as read off the extracted schema (all items share one 5-point
# agreement scale, «خیلی موافقم» first):
#   • 4 + 3 + 3  manipulation checks — pay emphasis, autonomy, controlling climate
#   • 3          work effort intention
#   • 3          expected performance (quality, quantity, timeliness)
#   • 18         Multidimensional Work Motivation Scale (Gagné et al., 2015):
#                amotivation, extrinsic-social, extrinsic-material, introjected,
#                identified, intrinsic — 3 items each, in the published order
#   • 6          demographics: age, province, gender, field of study, work
#                experience, and a closing comment box. ALL are required.
#
# Question ids and option strings are copied verbatim from form_schema.json.
# =============================================================================
version: 2
id: pay_autonomy_climate_vignette_fa
locale: fa

# Migrated from the 2.x fork `PersonaBot-new-behnaz` (its .env and Makefile).
form:
  provider: porsline
  url: https://survey.porsline.ir/s/Yiz8N63e
  max_pages: 400
# -----------------------------------------------------------------------------
# 1. POPULATION — Iranian adults with a university background, reached online
# -----------------------------------------------------------------------------
population:
  seed: null

  # Latent traits are DISPOSITIONS — what a respondent brings to any job. The
  # scenario is the situation, and it reaches the model as text in phase 3. The
  # experimental effects therefore come from how each disposition reads each
  # vignette, which is what the design is meant to measure. Nothing here encodes
  # a hypothesised effect of a scenario.
  #
  #   M = general work engagement      E = sensitivity to external contingencies
  #
  # Implied correlations — `make validate` prints this matrix, READ IT:
  #   r(autonomous, controlled)      = +0.33  MWMS identified/intrinsic vs
  #                                           introjected/extrinsic: modest, positive
  #   r(autonomous, amotivation)     = -0.44
  #   r(controlled, amotivation)     = -0.11  external regulation is close to
  #                                           orthogonal to amotivation
  #   r(conscientiousness, autonomous) = +0.43
  #   r(conscientiousness, amotivation) = -0.31
  #   r(attention, *)                ≈ +0.1…+0.2
  latent_model:
    common_factors: [M, E]
    dimensions:
      autonomous_motivation:
        loadings: {M: 0.75, E: 0.10}          # ΣL² = 0.573
        label: "انگیزه‌ی درونی و ارزشی برای کار (لذت بردن از کار و مهم دانستن آن)"
      controlled_motivation:
        loadings: {M: 0.35, E: 0.65}          # ΣL² = 0.545
        label: "حساسیت به پاداش، تأیید دیگران و احساس تعهد درونی‌شده (شرم یا عذاب وجدان)"
      amotivation:
        loadings: {M: -0.60, E: 0.15}         # ΣL² = 0.383
        label: "بی‌انگیزگی و بی‌معنا دانستن کار"
      work_conscientiousness:
        loadings: {M: 0.55, E: 0.15}          # ΣL² = 0.325
        label: "وظیفه‌شناسی و سخت‌کوشی در کار"
      vignette_attention:
        loadings: {M: 0.25, E: 0.0}           # ΣL² = 0.063
        label: "دقت در خواندن و به خاطر سپردن جزئیات سناریو"

  bands:
    cuts:   [-1.5, -0.9, -0.35, 0.35, 0.9, 1.5]
    labels: ["خیلی پایین", "پایین", "کمی پایین", "متوسط", "کمی بالا", "بالا", "خیلی بالا"]

  response_style:
    acquiescence:     {dist: normal, mu: 0.0, sigma: 0.40}
    extreme_response: {dist: normal, mu: 0.0, sigma: 0.40}
    careless:         {dist: bernoulli, p: 0.04}

  # --- demographics, in dependency order --------------------------------------
  # Values bound to a RADIO are the form's literal option strings. Values bound
  # to a TEXT box are written the way people type into one: «تهران», not
  # «استان تهران»; «کامپیوتر» as often as «مهندسی کامپیوتر».
  demographics:
    - name: gender
      dist: categorical
      choices: [["خانم", 0.56], ["آقا", 0.44]]   # online convenience samples in
                                                # Iran skew female

    - name: age
      dist: normal
      mu: 30
      sigma: 7
      round: int
      clip: [20, 55]
      on_out_of_range: resample

    # Not asked by the form; shapes the prose and the field of study.
    - name: education_level
      dist: conditional
      cases:
        - when: "age < 24"
          dist: categorical
          choices: [["کارشناسی", 0.80], ["کارشناسی ارشد", 0.15], ["کاردانی", 0.05]]
        - default: true
          dist: categorical
          choices:
            - ["کارشناسی", 0.42]
            - ["کارشناسی ارشد", 0.43]
            - ["دکتری", 0.09]
            - ["کاردانی", 0.06]

    - name: field_of_study
      dist: categorical
      choices:
        - ["مدیریت بازرگانی", 0.09]
        - ["مدیریت", 0.05]
        - ["مدیریت دولتی", 0.05]
        - ["مدیریت منابع انسانی", 0.03]
        - ["مدیریت صنعتی", 0.03]
        - ["حسابداری", 0.07]
        - ["اقتصاد", 0.03]
        - ["مهندسی کامپیوتر", 0.05]
        - ["کامپیوتر", 0.03]
        - ["مهندسی صنایع", 0.05]
        - ["مهندسی برق", 0.03]
        - ["عمران", 0.03]
        - ["مهندسی مکانیک", 0.03]
        - ["معماری", 0.02]
        - ["روانشناسی", 0.06]
        - ["علوم تربیتی", 0.03]
        - ["حقوق", 0.04]
        - ["پرستاری", 0.03]
        - ["زبان انگلیسی", 0.03]
        - ["شیمی", 0.02]
        - ["زیست شناسی", 0.02]
        - ["علوم ارتباطات", 0.02]
        - ["جامعه شناسی", 0.02]
        - ["ادبیات فارسی", 0.02]
        - ["تربیت بدنی", 0.02]
        - ["گرافیک", 0.02]
        - ["مامایی", 0.01]
        - ["ریاضی", 0.02]
        - ["فیزیک", 0.01]
        - ["کشاورزی", 0.02]
        - ["داروسازی", 0.01]
        - ["IT", 0.01]

    - name: province
      dist: categorical
      choices:
        - ["تهران", 0.28]
        - ["البرز", 0.05]
        - ["اصفهان", 0.07]
        - ["خراسان رضوی", 0.07]
        - ["فارس", 0.05]
        - ["آذربایجان شرقی", 0.04]
        - ["خوزستان", 0.04]
        - ["مازندران", 0.04]
        - ["گیلان", 0.03]
        - ["آذربایجان غربی", 0.03]
        - ["کرمان", 0.03]
        - ["قم", 0.02]
        - ["قزوین", 0.02]
        - ["کرمانشاه", 0.02]
        - ["یزد", 0.02]
        - ["همدان", 0.02]
        - ["مرکزی", 0.02]
        - ["گلستان", 0.02]
        - ["هرمزگان", 0.02]
        - ["لرستان", 0.015]
        - ["سیستان و بلوچستان", 0.015]
        - ["اردبیل", 0.01]
        - ["کردستان", 0.01]
        - ["زنجان", 0.01]
        - ["سمنان", 0.01]
        - ["بوشهر", 0.01]
        - ["چهارمحال و بختیاری", 0.01]
        - ["خراسان شمالی", 0.005]
        - ["خراسان جنوبی", 0.005]
        - ["کهگیلویه و بویراحمد", 0.005]
        - ["ایلام", 0.005]

    # Older respondents have almost all worked; conscientious ones a little more.
    - name: work_experience
      dist: bernoulli
      p: "clamp(0.30 + 0.045 * (age - 20) + 0.04 * z.work_conscientiousness, 0.25, 0.97)"
      labels: {"true": "بله", "false": "خیر"}

    # Not asked by the form; gives the prose a concrete working life.
    - name: current_status
      dist: conditional
      cases:
        - when: "work_experience == 'بله'"
          dist: categorical
          choices:
            - ["کارمند تمام‌وقت در بخش خصوصی", 0.34]
            - ["کارمند دولت یا شرکت دولتی", 0.24]
            - ["شاغل پاره‌وقت یا پروژه‌ای", 0.12]
            - ["کسب‌وکار شخصی یا آزادکار", 0.12]
            - ["دانشجو با سابقه‌ی کار", 0.10]
            - ["در حال حاضر بیکار و در جست‌وجوی کار", 0.08]
        - default: true
          dist: categorical
          choices:
            - ["دانشجو", 0.70]
            - ["فارغ‌التحصیل در جست‌وجوی کار", 0.22]
            - ["خانه‌دار", 0.08]

    # The form requires this box. Most people type a token reply.
    - name: closing_comment
      dist: categorical
      choices:
        - ["ندارم", 0.24]
        - ["نظری ندارم", 0.17]
        - ["موفق باشید", 0.16]
        - ["-", 0.09]
        - ["خیر", 0.06]
        - ["موفق و پیروز باشید", 0.06]
        - ["ممنون", 0.04]
        - ["سپاس", 0.03]
        - ["نه", 0.03]
        - ["سناریو کمی طولانی بود", 0.02]
        - ["پرسشنامه خوبی بود، موفق باشید", 0.03]
        - ["سوالات واضح بود", 0.02]
        - ["برای پایان نامه تون آرزوی موفقیت دارم", 0.02]
        - ["خسته نباشید", 0.03]

  derived_fields: []

# -----------------------------------------------------------------------------
# 2. SCENARIOS — verbatim from «سناریوها.docx». Keys are the numbers the form
#    prints in front of each scenario; that number is how phase 4 recognises
#    which one the form drew.
# -----------------------------------------------------------------------------
scenarios:
  - key: "1"
    factors: {pay: emphasized, autonomy: high, climate: controlling}
    text: "در سازمان شما ساختار پرداخت به‌گونه‌ای است که نیمی از دریافتی شما ثابت است و نیمی دیگر مستقیماً به عملکردتان در پروژه وابسته است. مدیر در طول انجام کار بارها بر پاداش مالی قابل توجه تأکید می‌کند و اشاره می‌کند که هرچه عملکرد شما بهتر باشد، پاداش مالی بیشتری دریافت خواهید کرد و نتیجه این پروژه به‌طور مستقیم بر پاداش مالی دریافتی شما اثر می‌گذارد. این موضوع به‌صورت مداوم در محیط کار یادآوری می‌شود.شما استقلال کاری بالایی در نحوه انجام کار دارید. می‌توانید درباره روش اجرای پروژه، ترتیب مراحل و زمان‌بندی فعالیت‌ها خودتان تصمیم بگیرید و برای هر مرحله نیاز به هماهنگی مستمر با سرپرست ندارید.محیط سازمان مبتنی بر کنترل و نظارت جدی است. تصمیم‌ها معمولاً به‌صورت یک‌طرفه اتخاذ می‌شوند، انتظار می‌رود دستورالعمل‌ها بدون بحث و گفتگو اجرا شوند و توضیح چندانی درباره دلایل تصمیم‌ها ارائه نمی‌شود. در صورت بروز مشکل، تمرکز مدیران بیشتر بر اصلاح سریع رفتار و تبعیت از دستورات است تا اینکه با تبادل نظر با کارکنان مشکل برطرف شود."

  - key: "2"
    factors: {pay: emphasized, autonomy: high, climate: supportive}
    text: "در سازمان شما ساختار پرداخت به‌گونه‌ای است که نیمی از دریافتی شما ثابت است و نیمی دیگر مستقیماً به عملکردتان در همین پروژه وابسته است. مدیر در طول انجام کار بارها بر پاداش مالی قابل توجه تأکید می‌کند و اشاره می‌کند که هرچه عملکرد شما بهتر باشد، پاداش مالی بیشتری دریافت خواهید کرد و نتیجه این پروژه به‌طور مستقیم بر پاداش مالی دریافتی شما اثر می‌گذارد. این موضوع به‌صورت مداوم در محیط کار یادآوری می‌شود. شما استقلال کاری بالایی در نحوه انجام کار دارید. می‌توانید درباره روش اجرای پروژه، ترتیب مراحل و زمان‌بندی فعالیت‌ها خودتان تصمیم بگیرید و برای هر مرحله نیاز به هماهنگی مستمر با سرپرست ندارید.فضای سازمانی حمایتگر است. مدیران به دیدگاه‌ها و پیشنهادهای کارکنان توجه می‌کنند، دلایل تصمیم‌ها را توضیح می‌دهند و در صورت بروز چالش، به‌جای اعمال فشار، از کارکنان درخواست می‌کنند که نظراتشان را بیان کنند تا بر اساس این تبادل نظر راه‌حل مناسب پیدا شود."

  - key: "3"
    factors: {pay: emphasized, autonomy: low, climate: controlling}
    text: "در سازمان شما ساختار پرداخت به‌گونه‌ای است که نیمی از دریافتی شما ثابت است و نیمی دیگر مستقیماً به عملکردتان در همین پروژه وابسته است.مدیر در طول انجام کار بارها بر پاداش مالی قابل توجه تأکید می‌کند و اشاره می‌کند که هرچه عملکرد شما بهتر باشد، پاداش مالی بیشتری دریافت خواهید کرد و نتیجه این پروژه به‌طور مستقیم بر پاداش مالی دریافتی شما اثر می‌گذارد. این موضوع به‌صورت مداوم در محیط کار یادآوری می‌شود.شما استقلال کاری پایینی در نحوه انجام کار دارید. مراحل انجام کار، روش اجرا و زمان‌بندی‌ها از پیش تعیین شده‌اند و برای هر تغییر یا تصمیم خارج از چارچوب باید با سرپرست هماهنگ کنید. انتظار می‌رود کار دقیقاً مطابق دستورالعمل‌ها انجام شود.محیط سازمان مبتنی بر کنترل و نظارت جدی است. تصمیم‌ها معمولاً به‌صورت یک‌طرفه اتخاذ می‌شوند، انتظار می‌رود دستورالعمل‌ها بدون بحث و گفتگو اجرا شوند و توضیح چندانی درباره دلایل تصمیم‌ها ارائه نمی‌شود. در صورت بروز مشکل، تمرکز مدیران بیشتر بر اصلاح سریع رفتار و تبعیت از دستورات است تا اینکه با تبادل نظر با کارکنان مشکل برطرف شود."

