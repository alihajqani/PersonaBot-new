# -----------------------------------------------------------------------------
# 3. SCHEMA INTERPRETATION
# -----------------------------------------------------------------------------
scales:
  - name: agreement5
    match:
      options_equal: ["خیلی موافقم", "موافقم", "تا حدودی", "مخالفم", "خیلی مخالفم"]
    coding: high_first              # option [0] «خیلی موافقم» is the high end

  - name: gender2
    match: {options_equal: ["آقا", "خانم"]}
    coding: low_first

  - name: yes_no
    match: {options_equal: ["بله", "خیر"]}
    coding: high_first

# One construct per subscale. Each is a separate model request, items shuffled.
constructs:
  # --- manipulation checks: answered from the scenario, not from disposition ---
  - key: check_pay_emphasis
    label: "برداشت از تأکید سازمان بر پاداش مالی"
    traits: [vignette_attention]
    match: {question_id_in: ["45898989", "45899032", "45899747", "45899803"]}
    # «در مورد پرداخت و پاداش مالی توضیحی ارائه نشد.» — agreeing means LESS
    # emphasis on pay.
    reverse_when: {question_id_in: ["45899803"]}

  - key: check_autonomy
    label: "برداشت از میزان استقلال کاری"
    traits: [vignette_attention]
    match: {question_id_in: ["45899830", "45899847", "45899889"]}
    reverse_when: {never: true}

  - key: check_controlling_climate
    label: "برداشت از کنترل‌گر بودن محیط سازمان"
    traits: [vignette_attention]
    match: {question_id_in: ["45899983", "45900007", "45899947"]}
    # «محیط سازمان حمایتگر است.» is the opposite pole of control.
    reverse_when: {question_id_in: ["45899947"]}

  # --- outcomes ---
  - key: work_effort
    label: "آمادگی برای تلاش بیشتر در این موقعیت"
    traits: [work_conscientiousness, autonomous_motivation]
    match: {question_id_in: ["45900034", "45900106", "45900133"]}
    reverse_when: {never: true}

  - key: expected_performance
    label: "عملکرد مورد انتظار در این موقعیت"
    traits: [work_conscientiousness]
    match: {question_id_in: ["45900169", "45900192", "45900226"]}
    reverse_when: {never: true}

  # --- MWMS ---
  - key: mwms_amotivation
    label: "بی‌انگیزگی در این شغل"
    traits: [amotivation]
    match: {question_id_in: ["45900382", "45900428", "45900454"]}
    reverse_when: {never: true}

  - key: mwms_extrinsic_social
    label: "انگیزه‌ی بیرونی اجتماعی (تأیید و احترام دیگران)"
    traits: [controlled_motivation]
    match: {question_id_in: ["45900493", "45900557", "45900578"]}
    reverse_when: {never: true}

  - key: mwms_extrinsic_material
    label: "انگیزه‌ی بیرونی مادی (پاداش مالی و امنیت شغلی)"
    traits: [controlled_motivation]
    match: {question_id_in: ["45900675", "45900704", "45900736"]}
    reverse_when: {never: true}

  - key: mwms_introjected
    label: "انگیزه‌ی درون‌فکنی‌شده (اثبات خود، پرهیز از شرم)"
    traits: [controlled_motivation]
    match: {question_id_in: ["45900760", "45900831", "45900870"]}
    reverse_when: {never: true}

  - key: mwms_identified
    label: "انگیزه‌ی همانندسازی‌شده (همسویی با ارزش‌های شخصی)"
    traits: [autonomous_motivation]
    match: {question_id_in: ["45901003", "45900935", "45901333"]}
    reverse_when: {never: true}

  - key: mwms_intrinsic
    label: "انگیزه‌ی درونی (لذت و علاقه به خود کار)"
    traits: [autonomous_motivation]
    match: {question_id_in: ["45901353", "45901472", "45901569"]}
    reverse_when: {never: true}

static_answers:
  - name: age
    match: {question_id_in: ["45901932"]}   # لطفا سن خود را وارد کنید.
    value: "{{ persona.demographics.age }}"

  - name: province
    match: {question_id_in: ["45901809"]}   # ساکن کدام استان هستید؟
    value: "{{ persona.demographics.province }}"

  - name: gender
    match: {question_id_in: ["45902010"]}   # جنسیت خود را مشخص کنید.
    value: "{{ persona.demographics.gender }}"

  - name: field_of_study
    match: {question_id_in: ["45902103"]}   # رشته تحصیلی خود را وارد کنید.
    value: "{{ persona.demographics.field_of_study }}"

  - name: work_experience
    match: {question_id_in: ["45909584"]}   # آیا تجربه شاغل بودن دارید؟
    value: "{{ persona.demographics.work_experience }}"

  - name: closing_comment
    match: {question_id_in: ["45902175"]}   # … هر نظر یا نکته ای … بنویسید. (required)
    value: "{{ persona.demographics.closing_comment }}"
    exclude_from_psychometrics: true

skip: []

# -----------------------------------------------------------------------------
# 4. ANSWERING POLICY
# -----------------------------------------------------------------------------
answering:
  chunk_by: construct
  shuffle_within_chunk: true
  temperature: {min: 0.55, max: 0.85}

  normalization:
    unicode: NFKC
    fold_arabic_to_persian: true
    zwnj: strip
    strip_trailing: ".,؛،۔"

  fuzzy: {algorithm: ratio, min_score: 86}

  completeness:
    min_ratio: 1.0                  # every question on the form is required
    denominator: answerable
    max_retries: 2
    retry_scope: failed_constructs_only

  careless:
    enabled: true
    anchor_stickiness: 0.70
    drift: [-1, 1]
    apply_static_answers: false

  reverse_tags: {direct: "[مستقیم]", reverse: "[معکوس]"}

response_style_nudges:
  rules:
    - {when: "acquiescence > 0.30",      text: "در گویه‌هایی که مطمئن نیستی، کمی به سمت «موافقم» گرایش داری."}
    - {when: "acquiescence < -0.30",     text: "در گویه‌هایی که مطمئن نیستی، کمی به سمت «مخالفم» گرایش داری."}
    - {when: "extreme_response > 0.30",  text: "وقتی نظرت روشن است، راحت «خیلی موافقم» یا «خیلی مخالفم» را انتخاب می‌کنی."}
    - {when: "extreme_response < -0.30", text: "معمولاً گزینه‌های میانی مثل «موافقم»، «تا حدودی» یا «مخالفم» را به دو سر طیف ترجیح می‌دهی."}
  default: "سبک پاسخ‌دهی‌ات معمولی و متعادل است."

# -----------------------------------------------------------------------------
# 5. ANALYSIS
# -----------------------------------------------------------------------------
analysis:
  reverse_keys_from: config
  warn_on_sign_disagreement: true
  response_style_min_scale_points: 3
  straightlining: {scope: within_construct, sd_threshold: 0.5}
  sanity: {alpha_max: 0.95, mean_inter_item_r_max: 0.6}
  min_items_for_alpha: 3
