            - ["مدیرکل دفتر امور شوراهای اسلامی شهر و روستا", 0.1250]
            - ["کارشناس برنامه‌ریزی و ارزیابی طرح‌های جامع حمل‌ونقل شهری", 0.1250]
            - ["کارشناس تدوین ضوابط، ساختار و تشکیلات شهرداری‌ها", 0.1250]
            - ["کارشناس ساماندهی بافت‌های ناکارآمد و اسکان غیررسمی", 0.1250]
            - ["کارشناس پایش بودجه و انضباط مالی شهرداری‌ها", 0.1250]
            - ["معاون هماهنگی امور عمرانی وزارت کشور", 0.1250]
            - ["کارشناس دفتر برنامه‌ریزی و بودجه امور شهری", 0.1250]
        - when: "org_name == 'سازمان شهرداری ها و دهیاری های کشور'"
