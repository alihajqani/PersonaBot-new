            - ["کارشناس بررسی و تطبیق مغایرت‌های اساسی طرح‌های شهری", 0.1250]
            - ["کارشناس تحلیل پیوست‌های زیست‌محیطی و پدافند کالبدی", 0.1250]
            - ["کارشناس پایش حرایم و جلوگیری از تداخل اراضی پیرامون شهرها", 0.1250]
            - ["کارشناس تطبیق مصوبات کالبدی با قوانین بالادستی", 0.1250]
            - ["دبیر کمیته فنی شماره دو شورای عالی شهرسازی", 0.1250]
            - ["عضو کارشناسی دبیرخانه شورای عالی شهرسازی", 0.1250]
        - when: "org_name == 'وزارت کشور'"
