        - when: "org_name == 'شهرداری تهران'"
          dist: categorical
          choices:
            - ["کارشناس مسئول انطباق پروانه‌ها با پهنه‌بندی طرح تفصیلی", 0.1250]
            - ["کارشناس پایش بارگذاری تراکم و عوارض ارزش افزوده", 0.1250]
            - ["کارشناس تدوین ضوابط سیما، منظر و کمیته‌های نما", 0.1250]
