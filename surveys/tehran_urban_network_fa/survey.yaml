# =============================================================================
# آسیب‌شناسی تعاملات نهادی دولت و سازمان‌های غیردولتی شهرسازی تهران
# survey.porsline.ir/s/Ub25MG8N — provider: porsline_v2
#
# This is a network/stance instrument, not a Likert battery. The matrices ask a
# respondent to describe their organisation's *position in a network* — who it
# exchanges information with, who holds power over whom, where each actor stands
# on four strategic goals. So the latent dimensions here are not "constructs" in
# the psychometric sense and `make analyze` will report low alphas for some of
# them by design: rating 35 different organisations is supposed to produce
# variance, not internal consistency. What the dimensions do is keep one
# respondent coherent across 210 cells.
#
# Question ids: matrix rows are flattened to "<matrix id>#<row index>" by the
# extractor, because the rendered table repeats the matrix's id on every cell.
# The id lists below were generated from output/form_schema.json — regenerate
# them (not by hand) if the form is republished.
# =============================================================================

version: 2
id: tehran_urban_network_fa
locale: fa

# Migrated from the 2.x fork `PersonaBot-new-sazmani` (its .env and Makefile).
form:
  provider: porsline_v2
  url: https://survey.porsline.ir/s/Ub25MG8N
  max_pages: 400
population:
  seed: 20260909

  # -------------------------------------------------------------------------
  # Three common factors stand behind everything a respondent says:
  #   f_position — where the respondent sits: state centre vs civil periphery
  #   f_reach    — how far their organisation's working network actually extends
  #   f_reform   — appetite for participatory, network-style governance
  # -------------------------------------------------------------------------
  latent_model:
    common_factors: [f_position, f_reach, f_reform]
    dimensions:
      information_reach:
        label: "گستره تبادل اطلاعات سازمان با سایر نهادها"
        loadings: {f_reach: 0.82, f_position: 0.25}
      formal_cooperation:
        label: "گستره همکاری رسمی و تفاهم‌نامه‌ای سازمان"
        loadings: {f_reach: 0.70, f_position: 0.45}
      resource_flow:
        label: "گستره تبادل منابع مالی و فنی سازمان"
        loadings: {f_reach: 0.60, f_position: 0.55}
      project_coordination:
        label: "گستره هماهنگی پروژه‌ای سازمان"
        loadings: {f_reach: 0.78, f_position: 0.30}
      perceived_state_power:
        label: "ادراک از تمرکز قدرت در بازیگران دولتی"
        loadings: {f_position: 0.55, f_reform: -0.40}
      pro_ngo_orientation:
        label: "گرایش به توانمندسازی سازمان‌های غیردولتی"
        loadings: {f_reform: 0.80, f_position: -0.35}
      reflective_openness:
        label: "صراحت و تفصیل در بازگویی تجربه نهادی"
        loadings: {f_reform: 0.45, f_reach: 0.35}

  bands:
    cuts: [-1.0, -0.35, 0.35, 1.0]
    labels: ["خیلی کم", "کم", "متوسط", "زیاد", "خیلی زیاد"]

  response_style:
    acquiescence: {dist: normal, mu: 0.30, sigma: 0.12, clip: [0.0, 1.0]}
    extremity:    {dist: normal, mu: 0.32, sigma: 0.15, clip: [0.0, 1.0]}
    # Straightlining is switched off under `answering.careless`. A careless
    # respondent is simulated by repeating one column, which for a network
    # matrix would claim an organisation has identical ties to all 35 actors —
    # noise this study has no use for at n=5.
    careless:     {dist: bernoulli, p: 0.0}

  # -------------------------------------------------------------------------
  # The frame: middle and senior managers across the Tehran urban-planning
  # network, balanced between the state bloc and the civil/professional bloc.
  # Declaration order is evaluation order — org_type must come before the
  # variables that branch on it.
  # -------------------------------------------------------------------------
  demographics:
    - name: org_type
      dist: categorical
      choices:
        - ["دولتی", 0.45]
        - ["نیمه دولتی", 0.15]
        - ["مردم نهاد", 0.20]
        - ["حرفه ای", 0.15]
        - ["خصوصی", 0.05]

    - name: experience
      dist: categorical
      choices:
        - ["3 تا 5 سال", 0.10]
        - ["5 تا 10 سال", 0.22]
        - ["10 تا 15 سال", 0.28]
        - ["15 تا 20 سال", 0.25]
        - ["بیش از 20 سال", 0.15]

    - name: age
      dist: conditional
      cases:
        - when: "experience == 'بیش از 20 سال'"
          dist: uniform_int
          low: 48
          high: 62
        - when: "experience == '15 تا 20 سال'"
          dist: uniform_int
          low: 43
          high: 56
        - when: "experience == '10 تا 15 سال'"
          dist: uniform_int
          low: 38
          high: 50
        - default: true
          dist: uniform_int
          low: 31
          high: 44

    - name: gender
      dist: categorical
      choices: [["مرد", 0.60], ["زن", 0.40]]

    - name: education
      dist: categorical
      choices:
        - ["کارشناسی ارشد شهرسازی", 0.34]
        - ["کارشناسی ارشد مدیریت شهری", 0.18]
        - ["دکتری شهرسازی/برنامه‌ریزی شهری", 0.16]
        - ["کارشناسی ارشد معماری", 0.16]
        - ["کارشناسی ارشد عمران", 0.16]

    # The organisation the respondent speaks for. These are the same 35 actors the
    # matrices ask about — a respondent is one node of the network they are rating —
    # plus four civil-society bodies, because only one NGO appears among the 35 and
    # the study's whole question is state vs. civil interaction. Weights lean toward
    # the Tehran-level bodies: the instrument is about this city's network, not the
    # national one.
    - name: org_name
      dist: conditional
      cases:
        - when: "org_type == 'دولتی'"
          dist: categorical
          choices:
            - ["وزارت راه و شهرسازی", 0.0565]
            - ["شورای عالی شهرسازی و معماری ایران", 0.0484]
            - ["وزارت کشور", 0.0403]
            - ["سازمان شهرداری ها و دهیاری های کشور", 0.0403]
            - ["کمیسیون عمران مجلس شورای اسلامی", 0.0323]
            - ["دیوان عدالت اداری", 0.0323]
            - ["سازمان بازرسی کل کشور", 0.0323]
            - ["شورای عالی استان ها", 0.0323]
            - ["شهرداری تهران", 0.1129]
            - ["شورای اسلامی شهر تهران", 0.0645]
            - ["استانداری تهران", 0.0645]
            - ["اداره کل راه و شهرسازی استان تهران", 0.0806]
            - ["کمیسیون ماده ۵ شهر تهران", 0.0565]
            - ["کمیسیون ماده ۱۰۰ شهرداری تهران", 0.0484]
            - ["سازمان مدیریت و برنامه‌ریزی استان تهران", 0.0484]
            - ["اداره کل میراث‌فرهنگی، گردشگری و صنایع‌دستی استان تهران", 0.0403]
            - ["اداره کل حفاظت محیط زیست استان تهران", 0.0403]
            - ["اداره کل جهاد کشاورزی استان تهران", 0.0323]
            - ["اداره کل ثبت اسناد و املاک استان تهران", 0.0323]
            - ["بنیاد مسکن انقلاب اسلامی", 0.0323]
            - ["مرکز تحقیقات راه، مسکن و شهرسازی", 0.0320]
        - when: "org_type == 'نیمه دولتی'"
          dist: categorical
          choices:
            - ["شرکت بازآفرینی شهری ایران", 0.1200]
            - ["سازمان نوسازی شهر تهران", 0.1400]
            - ["سازمان پیشگیری و مدیریت بحران شهر تهران", 0.1100]
            - ["مرکز مطالعات و برنامه‌ریزی شهر تهران", 0.1300]
            - ["سازمان فناوری اطلاعات و ارتباطات شهرداری تهران (فاوا)", 0.0900]
            - ["شرکت راه‌آهن شهری تهران و حومه (مترو)", 0.1000]
            - ["سازمان املاک و مستغلات شهرداری تهران", 0.0900]
            - ["نهاد راهبری و پایش طرح های توسعه شهری تهران", 0.1300]
            - ["شرکت آب و فاضلاب استان تهران", 0.0900]
        - when: "org_type == 'مردم نهاد'"
          dist: categorical
          choices:
            - ["جامعه مهندسان شهرساز ایران/ سمن های حوزه شهرسازی", 0.4000]
            - ["انجمن دیده‌بان شهرسازی و حقوق شهروندی", 0.2200]
            - ["سمن حفاظت از میراث شهری تهران", 0.1800]
            - ["شبکه سازمان‌های مردم‌نهاد محله‌محور تهران", 0.2000]
        - when: "org_type == 'حرفه ای'"
          dist: categorical
          choices:
            - ["سازمان نظام مهندسی ساختمان استان تهران", 0.4200]
            - ["انجمن انبوه‌سازان مسکن و ساختمان استان تهران", 0.2800]
            - ["دانشکده های معماری و شهرسازی دانشگاه های تهران", 0.3000]
        - default: true
          dist: categorical
          choices:
            - ["شرکت‌های مهندسین مشاور شهرسازی", 0.6200]
            - ["شرکت توسعه‌گر پروژه‌های شهری", 0.3800]

    # Job titles, per organisation. The list is the researcher's own field list of
    # real posts in each body, widened with further posts that exist in the Iranian
    # urban-planning system. Branching on org_name rather than org_type is what
    # stops a ثبت اسناد respondent from being handed a metro engineer's title.
    # Declaration order is evaluation order, so this must stay after org_name.
    - name: position_title
      dist: conditional
      cases:
        - when: "org_name == 'وزارت راه و شهرسازی'"
          dist: categorical
          choices:
            - ["مدیرکل دفتر نظارت بر طرح‌های توسعه و عمران", 0.1250]
