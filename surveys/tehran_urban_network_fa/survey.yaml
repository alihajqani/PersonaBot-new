        - when: "org_name == 'اداره کل راه و شهرسازی استان تهران'"
          dist: categorical
          choices:
            - ["معاون شهرسازی و معماری اداره‌کل", 0.1250]
            - ["معاون مسکن و ساختمان اداره‌کل", 0.1250]
            - ["کارشناس مسئول دبیرخانه کارگروه زیربنایی و شهرسازی استان", 0.1250]
            - ["کارشناس پایش و بازنگری طرح‌های جامع و تفصیلی استان تهران", 0.1250]
            - ["کارشناس تأمین و تخصیص اراضی دولتی جهت طرح‌های حمایتی مسکن", 0.1250]
            - ["کارشناس نظارت عالیه بر مقررات ملی ساختمان (ماده ۳۵)", 0.1250]
            - ["مدیرکل راه و شهرسازی استان تهران", 0.1250]
            - ["کارشناس املاک و امور حقوقی اداره‌کل", 0.1250]
        - when: "org_name == 'کمیسیون ماده ۵ شهر تهران'"
          dist: categorical
          choices:
