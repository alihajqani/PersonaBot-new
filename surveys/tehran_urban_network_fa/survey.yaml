  derived_fields:
    # `index` is the respondent's 1-based sequence number. Deriving the phone
    # number from it is what lets a row in Porsline's export be matched to the
    # transcript file on disk — see `transcripts` at the bottom of this file.
    # A second batch must continue the series: `--start-index 6` after five.
    - name: respondent_index
      dist: derived
      expr: "index"

# =============================================================================
# SCALES — response formats. `coding` is low_first everywhere: option [0] is the
# low end of every scale on this form (0 = no tie / no influence, and the stance
# scale runs from most-opposed to most-supportive).
# =============================================================================
scales:
  - name: relation_intensity_0_3
    coding: low_first
    match:
      options_equal: ["0", "1", "2", "3"]

  - name: influence_0_4
    coding: low_first
    match:
      options_equal: ["0", "1", "2", "3", "4"]

  - name: stance_minus4_plus4
    coding: low_first
    match:
      options_equal: ["4-/3-", "2-/1-", "0", "1+/2+", "3+/4+"]

  - name: organisation_type
    coding: low_first
    match:
      options_equal: ["دولتی", "نیمه دولتی", "خصوصی", "حرفه ای", "مردم نهاد", "سایر"]

  - name: years_of_experience
    coding: low_first
    match:
      options_equal: ["3 تا 5 سال", "5 تا 10 سال", "10 تا 15 سال", "15 تا 20 سال", "بیش از 20 سال"]

