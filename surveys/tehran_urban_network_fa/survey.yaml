            - ["کارشناس پایش بازار مسکن و اقتصاد زمین", 0.1250]
            - ["کارشناس تدوین مقررات ملی و ضوابط کنترل ساختمان", 0.1250]
            - ["کارشناس ارزیابی طرح‌های جامع و انطباق شهری", 0.1250]
            - ["معاون شهرسازی و معماری وزارت راه و شهرسازی", 0.1250]
