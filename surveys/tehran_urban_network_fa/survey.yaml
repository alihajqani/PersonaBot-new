# =============================================================================
# STATIC ANSWERS — the five questions on the opening page. All come from the
# sampled persona so the respondent's identity cannot drift, and the phone
# number is deterministic because it is the key that ties this submission to its
# transcript file.
# =============================================================================
static_answers:
  - name: organisation_name
    match: {question_id: "53941844"}
    value: "{{ persona.demographics.org_name }}"
    exclude_from_psychometrics: true

  - name: position_title
    match: {question_id: "53942105"}
    value: "{{ persona.demographics.position_title }}"
    exclude_from_psychometrics: true

  - name: organisation_type
    match: {question_id: "53941987"}
    value: "{{ persona.demographics.org_type }}"
    exclude_from_psychometrics: true

  - name: years_in_field
    match: {question_id: "53942259"}
    value: "{{ persona.demographics.experience }}"
    exclude_from_psychometrics: true

  # 09120000001, 09120000002, … — deliberately serial so the researcher can find
  # a response in Porsline's export and open the matching transcript by name.
  - name: contact_number
    match: {question_id: "53942610"}
    value: "{{ '0912%07d' | format(persona.derived.respondent_index) }}"
    exclude_from_psychometrics: true

# =============================================================================
answering:
  chunk_by: construct
  shuffle_within_chunk: true
  temperature: {min: 0.5, max: 0.8}

  completeness:
    # Every matrix cell is a required field on the live form, and the six voice
    # items are answered as text here, so nothing is optional from this side.
    min_ratio: 1.0
    max_retries: 2
    retry_scope: failed_constructs_only

  careless:
    # See the note under response_style: straightlining a network matrix asserts
    # identical ties to 35 different organisations, which is not the kind of
    # careless response this instrument would ever want to model.
    enabled: false

  fuzzy:
    # Matrix columns are one or two characters ("0", "3+/4+"). A near miss there
    # silently records the wrong score, so keep the bar high — an unmatched
    # answer is discarded and retried, which is the safe failure.
    min_score: 90

response_style_nudges:
  rules:
    - when: "acquiescence > 0.42"
      text: "شما معمولاً تمایل دارید روابط و همکاری‌ها را کمی پررنگ‌تر از آنچه هست گزارش کنید."
    - when: "extremity > 0.55"
      text: "شما در قضاوت صریح هستید و از به‌کاربردن دو سر طیف ابایی ندارید."
    - when: "extremity < 0.15"
      text: "شما محتاطید و ترجیح می‌دهید گزینه‌های میانی را انتخاب کنید."
  default: "شما متعادل پاسخ می‌دهید و قضاوت‌هایتان را بر تجربه کاری‌تان استوار می‌کنید."

# =============================================================================
# TRANSCRIPTS — the six voice questions, written to output/voice_texts/<phone>.txt
# `make transcripts` after `make answer`.
# =============================================================================
transcripts:
  enabled: true
  dir: voice_texts
  filename_from: "53942610"
  types: [VOICE]
  header: "پاسخ‌های پرسش‌های صوتی — پرسشنامه آسیب‌شناسی تعاملات نهادی شهرسازی تهران"

analysis:
  reverse_keys_from: config
  warn_on_sign_disagreement: true
  min_items_for_alpha: 3
